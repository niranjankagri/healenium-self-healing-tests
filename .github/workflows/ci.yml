# CI: start the Healenium backend (Postgres, hlm-backend, selector-imitator), then run the suite in order:
# release 1 (Healenium learns), release 2 healed, release 2 without healing (control).
# Each run starts with an empty database, so it always learns from release 1 first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a new Chrome or a broken image tag shows up within a week
    - cron: '50 23 * * 5'   # Friday 23:50 UTC
  workflow_dispatch:

# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Healenium self-healing tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start the Healenium backend
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180

      # ubuntu-latest has Google Chrome; Selenium Manager fetches the matching chromedriver
      - name: Build and test
        run: ./mvnw -B verify 2>&1 | tee target-test-output.log; exit "${PIPESTATUS[0]}"

      - name: Healed locators in the job summary
        if: ${{ !cancelled() }}
        run: bash scripts/healing-summary.sh target-test-output.log >> "$GITHUB_STEP_SUMMARY"

      - name: Test results in the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Test results"
            echo ""
            f=target/surefire-reports/testng-results.xml
            if [ -f "$f" ]; then
              line=$(grep -m1 -o '<testng-results [^>]*>' "$f")
              get() { echo "$line" | grep -o " $1=\"[^\"]*\"" | cut -d'"' -f2; }
              echo "| Total | Passed | Failed | Skipped |"
              echo "|---:|---:|---:|---:|"
              echo "| $(get total) | $(get passed) | $(get failed) | $(get skipped) |"
            else
              echo "No results: the build failed before the tests."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Backend logs when something failed
        if: ${{ failure() }}
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200

      - name: Keep the test results and failure screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-healenium
          path: |
            target/surefire-reports/
            target/screenshots/
            target-test-output.log
          if-no-files-found: warn
          retention-days: 30
