# Read by SelfHealingDriver at start-up. Any value can be overridden with -D, e.g. -Dheal-enabled=false.

# Turn healing on. With false the self-healing driver behaves like a plain one (but still saves references).
heal-enabled = true
# Candidates to try for one broken locator.
recovery-tries = 1
# Minimum similarity (0..1) between the saved reference element and a candidate before it is used.
score-cap = 0.5
# hlm-backend (infra/docker-compose.yml).
hlm.server.url = http://localhost:7878
# selector-imitator, published on host port 18000 (see the compose file for why not 8000).
hlm.imitator.url = http://localhost:18000
